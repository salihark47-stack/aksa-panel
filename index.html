<html lang="tr">
<head>

<meta name="theme-color" content="#0f3d3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Klinik Hesap Paneli</title>
<style>

#net{color:#ffd27a}
.demo{background:#fff4d6;color:#7a4d00;padding:8px 18px;font-size:13px;border-bottom:1px solid #f0d58a}
#nav{display:flex;gap:2px;padding:0 12px;background:#0f3d3e;overflow-x:auto;white-space:nowrap}
#nav button{background:transparent;border:0;color:#cfe3e3;padding:10px 13px;font-size:14px;cursor:pointer;border-radius:8px 8px 0 0;flex:none}
#nav button:hover{color:#fff}#nav button.active{background:var(--bg);color:var(--ink);font-weight:600}
main{padding:16px;max-width:1600px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card.danger{border-color:#f3c3be}
.card h2{font-size:16px;margin:0 0 12px}.card h3{font-size:14px;margin:16px 0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.between{justify-content:space-between;align-items:center}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.c{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.chip{background:#f3f6f8;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid #cdd5df;border-radius:8px;background:#fff;color:var(--ink);max-width:100%}
input:focus,select:focus{outline:2px solid #9bd0cd;border-color:var(--pri)}
input.num{text-align:right;width:130px}

td.wrap{white-space:normal}
th{font-size:12px;color:var(--muted);font-weight:600;background:#f8fafb;position:sticky;top:0;z-index:1}
td.l,th.l{text-align:left}
tr.tot td{font-weight:700;background:#eef4f4}
tr.click{cursor:pointer}tr.click:hover td{background:#f6faf9}tr.sel td{background:#e5f2f1}
.scroll{overflow:auto;max-height:72vh}
.grid2{display:grid;grid-template-columns:minmax(320px,460px) 1fr;gap:16px;align-items:start}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:14px}

.kpi .k{font-size:12px;color:var(--muted)}.kpi .v{font-size:17px;font-weight:700;margin-top:2px}
.kpi.net{background:var(--pri2);border-color:#b9dcdc}
.neg{color:var(--red)}.ok-t{color:var(--green);font-weight:700}.muted{color:var(--muted)}.small{font-size:12px}

.netc{background:var(--pri2)!important;font-weight:700}
.hint{background:#fff8e6;border:1px solid #f3dca1;border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
pre{background:#0f1720;color:#e6edf3;padding:12px;border-radius:8px;overflow:auto;font-size:12px}
.toast{position:fixed;bottom:20px;right:20px;left:auto;max-width:90vw;background:#1d2733;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
.toast.on{opacity:1}
.mbar{display:flex;gap:6px;align-items:center}.mbar b{min-width:120px;text-align:center}
.drop{display:block;border:2px dashed #9bc4c2;border-radius:14px;padding:34px 16px;text-align:center;cursor:pointer;background:#f7fbfb;transition:.15s}
.drop.over,.drop:hover{background:#e5f2f1;border-color:var(--pri)}.drop .big{font-size:17px;font-weight:650;margin-bottom:4px}
.lwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.lcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;margin:40px auto}
.lcard h1{font-size:20px;margin:0}.lcard h2{font-size:18px;margin:0}.lcard p{margin:0}
.printhead{display:none}
@media print{header,#nav,.noprint,.demo{display:none!important}main{padding:0;max-width:none}.card{border:0;padding:0}.scroll{max-height:none;overflow:visible}body{background:#fff;font-size:10px}th,td{padding:3px 4px}.printhead{display:block}td.in input{border:0;width:auto;padding:0}}
</style>
</head>

main.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act])ACT[a.dataset.act](a,e)});
main.addEventListener('change',e=>CHANGE.forEach(f=>f(e.target,e)));
main.addEventListener('input',e=>INPUT.forEach(f=>f(e.target,e)));
main.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.enter){e.preventDefault();e.target.blur&&e.target.dispatchEvent(new Event('change',{bubbles:true}));ACT[e.target.dataset.enter](e.target,e)}});
function monthBar(){return`<div class="mbar"><button class="b s" data-act="mPrev">‹</button><b>${monthName(U.month)}</b><button class="b s" data-act="mNext">›</button><button class="b s" data-act="mNow">Bu ay</button></div>`}
ACT.mPrev=()=>{U.month=shiftMonth(U.month,-1);U.edit={};render()};
ACT.mNext=()=>{U.month=shiftMonth(U.month,1);U.edit={};render()};
ACT.mNow=()=>{U.month=ym(todayStr());U.edit={};render()};
const PAGES={genel:()=>renderGenel(),kk:()=>renderLedger('kk'),avans:()=>renderLedger('avans'),iade:()=>renderLedger('iade'),lab:()=>renderLedger('lab'),aylik:()=>renderAylik(),imp:()=>renderImport(),yonetim:()=>renderYonetim()};
function render(){
  if(!isAdmin()&&TABS.find(t=>t[0]===U.tab&&t[2]))U.tab='genel';
  syncWatch();settingsDirty=false;
  $('clinicName').textContent=S.settings.clinicName||'Klinik Hesap Paneli';
  $('who').textContent=(S.name||S.email)+' · '+(isAdmin()?'Yönetici':'Personel');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===U.tab));
  PAGES[U.tab]()}
function refresh(){
  if(!S.settingsLoaded)return;
  const t=typing();
  if(settingsDirty&&!t&&U.tab!=='imp')return render();
  if(U.tab==='genel')return refreshGenel();
  if(LED[U.tab])return refreshLedger();
  if(U.tab==='aylik')return t?updateAylik():renderAylik();
  if(U.tab==='yonetim'&&!t)return renderYonetim()}

/* ================= GENEL (GÜNLÜK) ================= */
function renderGenel(){
  const d=U.date,day=getDay(d);const docs=S.doctors.filter(x=>x.active!==false||day.e[x.id]);
  main.innerHTML=`<div class="grid2"><div class="card"><h2>Günlük giriş</h2>
    <div class="row" style="margin-bottom:12px"><button class="b s" data-act="dayPrev">‹</button><input type="date" id="dayDate" value="${d}"><button class="b s" data-act="dayNext">›</button><button class="b s" data-act="dayToday">Bugün</button></div>
    ${docs.length?'':`<div class="hint">Henüz doktor yok.${isAdmin()?' Yönetim sekmesinden doktor ekleyin.':' Yöneticinizden doktorları eklemesini isteyin.'}</div>`}
    <table><thead><tr><th class="l">Doktor / başlık</th><th>Bugünkü kazanç (₺)</th></tr></thead><tbody>
    ${docs.map(x=>`<tr><td class="l">${esc(x.name)}</td><td class="in"><input inputmode="decimal" data-earn="${x.id}" placeholder="0"></td></tr>`).join('')}</tbody></table>
    <h3>Harcamalar</h3><div id="expList"></div>
    <div class="row" style="margin-top:6px"><input id="expDesc" placeholder="Ne için? (ör. Market, Kargo)" style="flex:1;min-width:150px" data-enter="expAdd"><input id="expAmt" class="num" placeholder="Tutar" inputmode="decimal" data-enter="expAdd"><button class="b s p" data-act="expAdd">Ekle</button></div>
    <h3>Kredi kartı</h3><div class="row"><label class="f">Günün toplam kredi kartı (POS)<input class="num" inputmode="decimal" id="dayKK" placeholder="0"></label><span id="kkHint"></span></div>
    <label class="f" style="margin-top:10px">Günün notu<input id="dayNote"></label>
    <div class="kpis" id="dayKpis"></div><div class="muted small" style="margin-top:8px">Yazdığınız her değer kutudan çıkınca kaydedilir ve diğer cihazlarda da görünür.</div></div>
    <div class="card"><div class="row between" style="margin-bottom:10px"><h2 style="margin:0">Gün gün rapor</h2>${monthBar()}${isAdmin()?`<button class="b s" data-act="xlsGenel">Excel'e aktar</button>`:''}</div><div class="scroll" id="monthTable"></div></div></div>`;
  refreshGenel()}
function refreshGenel(){
  const day=getDay(U.date);
  document.querySelectorAll('[data-earn]').forEach(i=>{if(i!==document.activeElement){const v=day.e[i.dataset.earn];i.value=v?fmt(v):''}});
  const k=$('dayKK');if(k&&k!==document.activeElement)k.value=day.kk?fmt(day.kk):'';
  const n=$('dayNote');if(n&&n!==document.activeElement)n.value=day.n;
  const kkPage=sum(entries('kk',ym(U.date)).filter(e=>e.date===U.date).map(e=>e.amount));const h=$('kkHint');
  if(h)h.innerHTML=kkPage&&Math.abs(kkPage-day.kk)>0.01?`<button class="b s" data-act="kkFromPage">Kredi Kartı sayfasındaki toplamı al (${fmt(kkPage)})</button>`:'';
  const el=$('expList');if(el){const xs=expList(day);el.innerHTML=xs.length?`<table><tbody>${xs.map(x=>`<tr><td class="l">${esc(x.d||'—')}${x.bn?` <span class="muted small">· ${esc(x.bn)}</span>`:''}</td><td>${fmt(x.a)} ₺</td><td style="width:1%"><button class="b s d" data-act="expDel" data-id="${x.id}">Sil</button></td></tr>`).join('')}<tr class="tot"><td class="l">Toplam harcama</td><td>${fmt(sum(xs.map(e=>e.a)))} ₺</td><td></td></tr></tbody></table>`:'<div class="muted small">Bu gün için harcama girilmedi.</div>'}
  const c=dayCalc(U.date);const kp=$('dayKpis');if(kp)kp.innerHTML=[['Toplam',c.toplam],['Harcama',c.harcama],['Kalan',c.kalan],['Kredi kartı',c.kk]].map(([a,v])=>`<div class="kpi"><div class="k">${a}</div><div class="v">${fmtc(v)}</div></div>`).join('')+`<div class="kpi net"><div class="k">NET (nakit)</div><div class="v">${fmtc(c.net)}</div></div>`;
  renderMonthTable()}
function renderMonthTable(){
  const el=$('monthTable');if(!el)return;const m=U.month,days=monthDays(m);
  if(!days.length){el.innerHTML='<div class="muted">Bu ay için kayıt yok.</div>';return}
  const docs=S.doctors.filter(d=>days.some(k=>+((Mo(m).days[k].e||{})[d.id])));
  const T={toplam:0,harcama:0,kalan:0,kk:0,net:0},DT={};
  const rows=days.map(k=>{const x=getDay(k),c=dayCalc(k);Object.keys(T).forEach(f=>T[f]+=c[f]);docs.forEach(d=>DT[d.id]=(DT[d.id]||0)+(+x.e[d.id]||0));
    return`<tr class="click ${k===U.date?'sel':''}" data-act="goDay" data-d="${k}"><td class="l">${trDate(k)}</td>${docs.map(d=>`<td>${x.e[d.id]?fmt(x.e[d.id]):''}</td>`).join('')}<td><b>${fmt(c.toplam)}</b></td><td title="${esc(expList(x).map(e=>(e.d||'—')+': '+fmt(e.a)).join('\n'))}">${fmt(c.harcama)}</td><td>${fmt(c.kalan)}</td><td>${fmt(c.kk)}</td><td class="netc">${fmtc(c.net)}</td><td class="l small muted">${esc(x.n)}</td></tr>`}).join('');
  el.innerHTML=`<table><thead><tr><th class="l">Tarih</th>${docs.map(d=>`<th>${esc(d.name)}</th>`).join('')}<th>Toplam</th><th>Harcama</th><th>Kalan</th><th>Kredi kartı</th><th>Net</th><th class="l">Not</th></tr></thead><tbody>${rows}
  <tr class="tot"><td class="l">AY TOPLAMI</td>${docs.map(d=>`<td>${fmt(DT[d.id])}</td>`).join('')}<td>${fmt(T.toplam)}</td><td>${fmt(T.harcama)}</td><td>${fmt(T.kalan)}</td><td>${fmt(T.kk)}</td><td class="netc">${fmtc(T.net)}</td><td></td></tr></tbody></table>
  <div class="muted small" style="margin-top:6px">Satıra tıklayınca o günü açar. Harcama hücresinin üzerine gelince kalemleri görürsünüz.</div>`}
function setDate(d){U.date=d;U.month=ym(d);syncWatch();renderGenel()}
ACT.dayPrev=()=>setDate(shiftDay(U.date,-1));
ACT.dayNext=()=>setDate(shiftDay(U.date,1));
ACT.dayToday=()=>setDate(todayStr());
ACT.goDay=a=>setDate(a.dataset.d);
ACT.expAdd=()=>{const ds=$('expDesc'),am=$('expAmt'),v=parseNum(am.value);if(!v){am.focus();toast('Harcama tutarını yazın');return}
  patchMonth(ym(U.date),{days:{[U.date]:{x:{[uid()]:{d:ds.value.trim(),a:v,...me()}}}}});ds.value='';am.value='';ds.focus()};
ACT.expDel=a=>{if(!confirm('Bu harcama silinsin mi?'))return;patchMonth(ym(U.date),{days:{[U.date]:{x:{[a.dataset.id]:DEL}}}})};
ACT.kkFromPage=()=>{const v=sum(entries('kk',ym(U.date)).filter(e=>e.date===U.date).map(e=>e.amount));patchMonth(ym(U.date),{days:{[U.date]:{kk:v||DEL}}})};
CHANGE.push(t=>{
  if(U.tab!=='genel')return;
  if(t.id==='dayDate'&&t.value)return setDate(t.value);
  const m=ym(U.date),d=U.date;
  if(t.dataset.earn){const v=parseNum(t.value);t.value=v?fmt(v):'';if(v!==(+getDay(d).e[t.dataset.earn]||0))patchMonth(m,{days:{[d]:{e:{[t.dataset.earn]:v||DEL}}}})}
  else if(t.id==='dayKK'){const v=parseNum(t.value);t.value=v?fmt(v):'';if(v!==getDay(d).kk)patchMonth(m,{days:{[d]:{kk:v||DEL}}})}
  else if(t.id==='dayNote'){const v=t.value.trim();if(v!==getDay(d).n)patchMonth(m,{days:{[d]:{n:v||DEL}}})}});

/* ================= DEFTERLER ================= */
const LED={
  kk:{title:'Kredi Kartı',desc:'Hangi doktora (veya başlığa) ne kadar kredi kartıyla işlem yapıldı.',techs:false},
  avans:{title:'Avans',desc:'Hangi doktor ya da teknisyen ne kadar avans aldı.',techs:true},
  iade:{title:'İade',desc:'Hangi doktorun hastasına ne kadar iade yapıldı. Doktorun cirosundan düşülür.',techs:false},
  lab:{title:'Teknisyen İşleri',desc:'Doktor seçilirse tutar o doktorun hesabından düşülür ve teknisyenin ödemesine eklenir.'}};
function editEntry(type){const e=U.edit[type];if(!e)return null;const x=(Mo(e.m)[type]||{})[e.id];return x?{id:e.id,m:e.m,...x}:null}
function renderLedger(type){
  const cfg=LED[type],m=U.month,ed=editEntry(type);
  const defDate=ed?ed.date:(U.date.startsWith(m)?U.date:(ym(todayStr())===m?todayStr():m+'-01'));
  const docs=S.doctors.filter(d=>d.active!==false||(ed&&ed.docId===d.id)),techs=S.technicians.filter(t=>t.active!==false||(ed&&ed.techId===t.id));
  let who;
  if(type==='lab')who=`<label class="f">Teknisyen<select id="ledTech"><option value="">— seçin —</option>${techs.map(t=>`<option value="${t.id}" ${ed&&ed.techId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label>
    <label class="f">Hangi doktorun işi?<select id="ledDoc"><option value="">— Doktora yansımasın (klinik) —</option>${docs.map(d=>`<option value="${d.id}" ${ed&&ed.docId===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label>`;
  else{const cur=ed?(ed.docId?'d:'+ed.docId:ed.techId?'t:'+ed.techId:'x'):'';
    who=`<label class="f">Kime<select id="ledWho"><option value="">— seçin —</option><optgroup label="Doktorlar">${docs.map(d=>`<option value="d:${d.id}" ${cur==='d:'+d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</optgroup>
    ${cfg.techs?`<optgroup label="Teknisyenler">${techs.map(t=>`<option value="t:${t.id}" ${cur==='t:'+t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</optgroup>`:''}
    <option value="x" ${cur==='x'?'selected':''}>Diğer başlık…</option></select></label>
    <label class="f" id="ledTitleWrap" style="${cur==='x'?'':'display:none'}">Başlık<input id="ledTitle" value="${esc(ed&&ed.title||'')}" placeholder="ör. Klinik"></label>`}
  main.innerHTML=`<div class="card"><div class="row between"><h2 style="margin:0">${cfg.title}</h2>${monthBar()}${isAdmin()?`<button class="b s" data-act="xlsLedger" data-type="${type}">Excel'e aktar</button>`:''}</div>
    <p class="muted small">${cfg.desc}</p>
    <div class="row"><label class="f">Tarih<input type="date" id="ledDate" value="${defDate}"></label>${who}
      <label class="f">Tutar (₺)<input id="ledAmt" class="num" inputmode="decimal" value="${ed?fmt(ed.amount):''}" data-enter="ledSave"></label>
      <label class="f" style="flex:1;min-width:160px">Açıklama<input id="ledNote" value="${esc(ed&&ed.note||'')}" data-enter="ledSave"></label>
      <button class="b p" data-act="ledSave">${ed?'Güncelle':'Kaydet'}</button>${ed?'<button class="b" data-act="ledCancel">Vazgeç</button>':''}</div></div>
    <div id="ledBody"></div>`;
  refreshLedger()}
function refreshLedger(){
  const type=U.tab,m=U.month,list=entries(type,m),el=$('ledBody');if(!el)return;const ed=U.edit[type];
  const groups={};list.forEach(e=>{const k=type==='lab'?techName(e.techId):whoLabel(e);groups[k]=(groups[k]||0)+(+e.amount||0)});
  let extra='';
  if(type==='lab'){const bd={};list.forEach(e=>{const k=e.docId?docName(e.docId):'Klinik (doktora yansımayan)';bd[k]=(bd[k]||0)+(+e.amount||0)});
    extra=`<h3>Doktor bazında (doktordan düşülen)</h3><table><tbody>${Object.keys(bd).sort(trSort).map(k=>`<tr><td class="l">${esc(k)}</td><td>${fmt(bd[k])}</td></tr>`).join('')||'<tr><td class="l muted">Kayıt yok</td></tr>'}</tbody></table>`}
  if(type==='kk'){const ds=[...new Set([...list.map(e=>e.date),...monthDays(m).filter(k=>getDay(k).kk)])].sort();
    extra=`<h3>Günlük kontrol (Genel sayfası ile)</h3><table><thead><tr><th class="l">Tarih</th><th>Bu sayfa</th><th>Genel</th><th>Fark</th></tr></thead><tbody>${ds.map(k=>{const a=sum(list.filter(e=>e.date===k).map(e=>e.amount)),b=getDay(k).kk;return`<tr><td class="l">${trDate(k)}</td><td>${fmt(a)}</td><td>${fmt(b)}</td><td>${Math.abs(a-b)<0.01?'<span class="ok-t">✓</span>':fmtc(a-b)}</td></tr>`}).join('')||'<tr><td class="l muted">Kayıt yok</td></tr>'}</tbody></table>`}
  const tot=sum(list.map(e=>e.amount));
  el.innerHTML=`<div class="grid2" style="grid-template-columns:1fr minmax(280px,400px)">
  <div class="card"><h2>${monthName(m)} kayıtları</h2><div class="scroll"><table><thead><tr><th class="l">Tarih</th>${type==='lab'?'<th class="l">Teknisyen</th><th class="l">Doktor</th>':'<th class="l">Kime</th>'}<th>Tutar</th><th class="l">Açıklama</th><th class="l">Giren</th><th></th></tr></thead><tbody>
  ${list.map(e=>`<tr class="${ed&&ed.id===e.id?'sel':''}"><td class="l">${trDate(e.date)}</td>${type==='lab'?`<td class="l">${esc(techName(e.techId))}</td><td class="l">${esc(e.docId?docName(e.docId):'Klinik')}</td>`:`<td class="l">${esc(whoLabel(e))}</td>`}<td>${fmt(e.amount)}</td><td class="l">${esc(e.note||'')}</td><td class="l small muted">${esc(e.bn||'')}</td><td><button class="b s" data-act="ledEdit" data-id="${e.id}">Düzenle</button> <button class="b s d" data-act="ledDel" data-id="${e.id}">Sil</button></td></tr>`).join('')||`<tr><td class="l muted" colspan="7">Bu ay kayıt yok.</td></tr>`}
  ${list.length?`<tr class="tot"><td class="l">TOPLAM</td>${type==='lab'?'<td></td><td></td>':'<td></td>'}<td>${fmt(tot)}</td><td></td><td></td><td></td></tr>`:''}</tbody></table></div></div>
  <div class="card"><h2>${type==='lab'?'Teknisyen bazında':'Kişi / başlık bazında'}</h2><table><tbody>${Object.keys(groups).sort(trSort).map(k=>`<tr><td class="l">${esc(k)}</td><td>${fmt(groups[k])}</td></tr>`).join('')||'<tr><td class="l muted">Kayıt yok</td></tr>'}
  ${list.length?`<tr class="tot"><td class="l">Toplam</td><td>${fmt(tot)}</td></tr>`:''}</tbody></table>${extra}</div></div>`}
CHANGE.push(t=>{if(t.id==='ledWho'){const w=$('ledTitleWrap');if(w)w.style.display=t.value==='x'?'':'none'}if(t.id==='ledAmt'){const v=parseNum(t.value);t.value=v?fmt(v):''}});
ACT.ledSave=()=>{
  const type=U.tab,date=$('ledDate').value,amount=parseNum($('ledAmt').value),note=$('ledNote').value.trim();
  if(!date){toast('Tarih seçin');return}if(!amount){toast('Tutar girin');$('ledAmt').focus();return}
  const e={date,amount,note,docId:null,techId:null,title:''};
  if(type==='lab'){e.techId=$('ledTech').value||null;e.docId=$('ledDoc').value||null;if(!e.techId){toast('Teknisyen seçin');return}}
  else{const w=$('ledWho').value;if(!w){toast('Kime olduğunu seçin');return}
    if(w==='x'){e.title=$('ledTitle').value.trim();if(!e.title){toast('Başlık yazın');return}}else if(w.startsWith('d:'))e.docId=w.slice(2);else e.techId=w.slice(2)}
  const ed=editEntry(type);const id=ed?ed.id:uid();const m=ym(date);
  if(ed&&ed.m!==m)patchMonth(ed.m,{[type]:{[id]:DEL}});
  patchMonth(m,{[type]:{[id]:{...e,...me(),at:ed?(ed.at||Date.now()):Date.now()}}});
  U.edit[type]=null;U.date=date;if(m!==U.month)U.month=m;toast(ed?'Güncellendi':'Kaydedildi');renderLedger(type);const am=$('ledAmt');if(am)am.focus()};
ACT.ledCancel=()=>{U.edit[U.tab]=null;renderLedger(U.tab)};
ACT.ledEdit=a=>{U.edit[U.tab]={id:a.dataset.id,m:U.month};renderLedger(U.tab);window.scrollTo(0,0)};
ACT.ledDel=a=>{if(!confirm('Bu kayıt silinsin mi?'))return;patchMonth(U.month,{[U.tab]:{[a.dataset.id]:DEL}})};

/* ================= AYLIK HESAP (yönetici) ================= */
const CF=['genel','iade','s1','tek','s2','yuzde','avans','s3','kk','kkNet','kkKes','s4','s5','s6','impTutar','net'];
function renderAylik(){
  const m=U.month,docs=monthDoctors(m);
  const rows=docs.map(d=>{const c=calcDoc(m,d),r=mget(m,d.id);
    const inp=(f,val,ph,on=true)=>on?`<td class="in"><input inputmode="decimal" data-mon="${d.id}" data-field="${f}" value="${val!=null&&val!==''&&+val!==0?fmt(val):''}" placeholder="${ph}"></td>`:'<td class="muted">—</td>';
    const cell=(f,cls='')=>`<td id="c-${d.id}-${f}" class="${cls}">${fmtc(c[f])}</td>`;
    return`<tr><td class="l"><b>${esc(d.name)}</b>${d.active===false?' <span class="muted small">(ayrıldı)</span>':''}</td>${cell('genel')}${cell('iade')}${cell('s1')}${cell('tek')}${cell('s2')}<td>%${fmt(c.rate)}</td>${cell('yuzde')}${cell('avans')}${cell('s3')}${cell('kk')}
    ${inp('fatura',r.fatura,'0',!!d.fatura)}${cell('kkNet')}<td id="c-${d.id}-kkKes" title="Oran: %${fmt(c.kkRate)}">${d.kkOn?fmtc(c.kkKes):'<span class="muted">yok</span>'}</td>${cell('s4')}
    ${inp('banka',r.banka,fmt(+d.banka||0))}${cell('s5')}${inp('sigorta',r.sigorta,fmt(+d.sigorta||0))}${cell('s6')}
    ${inp('implant',r.implant,'0',!!d.implant)}${cell('impTutar')}${inp('diger',r.diger,'0')}${cell('net','netc')}</tr>`}).join('');
  main.innerHTML=`<div class="printhead"><h2>${esc(S.settings.clinicName||'')} — ${monthName(m)} Aylık Hesap</h2></div>
  <div class="card"><div class="row between"><h2 style="margin:0">Doktor ödemeleri</h2>${monthBar()}
    <div class="row noprint"><button class="b s" data-act="xlsMonth">Ayı Excel'e aktar</button><button class="b s" data-act="print">Yazdır / PDF</button><button class="b s p" data-act="mailMonth">Ay sonu raporunu e-postayla gönder</button></div></div>
    <p class="muted small noprint">Fatura, banka, sigorta, implant adedi ve "diğer" alanlarını tabloya yazın. Banka/sigorta boş kalırsa doktorun varsayılan değeri kullanılır. "Diğer"e eksi değer de yazılabilir.</p>

  days.forEach(k=>{const x=getDay(k),c=dayCalc(k);docs.forEach((d,i)=>DT[i]+=+x.e[d.id]||0);[c.toplam,c.harcama,c.kalan,c.kk,c.net].forEach((v,i)=>T[i]+=v);rows.push([trDate(k),...docs.map(d=>x.e[d.id]||''),c.toplam,c.harcama,c.kalan,c.kk,c.net,expList(x).map(e=>(e.d||'—')+': '+fmt(e.a)).join(' | '),x.n])});
  rows.push(B(['TOPLAM',...DT,...T]));return{name:'Günlük Genel',rows}}
function shLedger(type,m){const list=entries(type,m),rows=[[{v:LED[type].title+' — '+monthName(m),b:1}],[]];
  if(type==='lab'){rows.push(H(['Tarih','Teknisyen','Doktor','Tutar','Açıklama','Giren']));list.forEach(e=>rows.push([trDate(e.date),techName(e.techId),e.docId?docName(e.docId):'Klinik',e.amount,e.note||'',e.bn||'']));rows.push(B(['TOPLAM','','',sum(list.map(e=>e.amount)),'','']))}
  else{rows.push(H(['Tarih','Kime','Tutar','Açıklama','Giren']));list.forEach(e=>rows.push([trDate(e.date),whoLabel(e),e.amount,e.note||'',e.bn||'']));rows.push(B(['TOPLAM','',sum(list.map(e=>e.amount)),'','']))}
  return{name:LED[type].title,rows}}
const AY_H=['Doktor','Genel','İade','Sonuç','Teknisyen','Sonuç','Oran %','Yüzde','Avans','Sonuç','KK','Fatura','KK - Fatura','KK kesinti %','KK kesinti','Sonuç','Banka','Sonuç','Sigorta','Sonuç','İmplant adet','İmplant tutar','Diğer','NET ÖDEME'];
function ayRows(m){const docs=monthDoctors(m),cs=docs.map(d=>calcDoc(m,d));const rows=docs.map((d,i)=>{const c=cs[i];return[d.name,c.genel,c.iade,c.s1,c.tek,c.s2,c.rate,c.yuzde,c.avans,c.s3,c.kk,c.fatura,c.kkNet,c.kkRate,c.kkKes,c.s4,c.banka,c.s5,c.sigorta,c.s6,c.impAdet,c.impTutar,c.diger,{v:c.net,b:1}]});
  const T=f=>sum(cs.map(c=>c[f]));rows.push(B(['TOPLAM',T('genel'),T('iade'),T('s1'),T('tek'),T('s2'),'',T('yuzde'),T('avans'),T('s3'),T('kk'),T('fatura'),T('kkNet'),'',T('kkKes'),T('s4'),T('banka'),T('s5'),T('sigorta'),T('s6'),T('impAdet'),T('impTutar'),T('diger'),T('net')]));return rows}
function shAylik(m){const rows=[[{v:(S.settings.clinicName||'')+' — '+monthName(m)+' Doktor Ödemeleri',b:1}],[],H(AY_H),...ayRows(m)];const tc=calcTechs(m);

/* ================= EXCEL'DEN AL (tek tıkla tarama) ================= */
const KIND={earn:'Günlük kazanç (Genel)',kk:'Kredi kartı',avans:'Avans',iade:'İade',son:'Aylık özet (Son sayfası)',skip:'Aktarma'};
const IMP={file:'',sheets:null,R:[],months:{},newOn:{},result:null,undo:null,busy:false};
const TOTALISH=/^(toplam|genel|sonuc|sonuç|net|tarih|gün|gun|ay|total)$/;
function matchPerson(txt,techs){const n=normName(txt);if(n.length<2)return'';
  const pool=[...S.doctors.map(d=>['d:'+d.id,normName(d.name)]),...(techs?S.technicians.map(t=>['t:'+t.id,normName(t.name)]):[])];
  const ex=pool.find(p=>p[1]===n);if(ex)return ex[0];
  if(n.length>=3){const pr=pool.filter(p=>p[1].length>=3&&(p[1].startsWith(n)||n.startsWith(p[1])));if(pr.length===1)return pr[0][0]}return''}
function guessKind(name,rows){const n=normName(name);
  if(/genel|gunluk|günlük/.test(n))return'earn';if(/kredi|kart|^kk/.test(n))return'kk';if(/avans/.test(n))return'avans';if(/iade/.test(n))return'iade';if(/^son|hesap|ozet|özet|odeme|ödeme|maas|maaş/.test(n))return'son';
  if(findSonHeaders(rows).length)return'son';return'skip'}
const impNum=v=>typeof v==='number'?v:parseNum(v);
function monthFromLabel(v){
  if(typeof v==='number'){const d=cellDate(v);return d?ym(d):null}
  const s=String(v||'').toLocaleLowerCase('tr');if(!s.trim())return null;
  const d=cellDate(s);if(d)return ym(d);
  let y=(s.match(/(20\d\d)/)||[])[1];if(!y){const m2=s.match(/(?:^|\D)(\d\d)(?:\D|$)/);if(m2)y='20'+m2[1]}if(!y)return null;
  const toks=s.replace(/[^a-zçğıöşü]+/g,' ').trim().split(/\s+/).filter(Boolean);
  const tm=TMONTHS.map(x=>x.replace(/ı/g,'i'));
  for(const t0 of toks){const t=t0.replace(/ı/g,'i');for(const L of[3,2]){if(t.length<L)continue;const c=tm.map((x,i)=>x.startsWith(t.slice(0,L))?i:-1).filter(i=>i>=0);if(c.length===1)return y+'-'+pad(c[0]+1)}}
  return null}
function findSonHeaders(rows){const out=[];rows.slice(0,5000).forEach((r,ri)=>{const n=r.map(normName);if(n.includes('genel')&&(n.includes('teknisyen')||n.includes('yuzde')||n.includes('yüzde'))&&n.some(x=>x==='kk'||x==='avans'))out.push(ri)});return out}
// --- sayfa çözümleme ---
function analyze(R){const sh=IMP.sheets[R.si];const rows=sh.rows.slice(0,6000);R.err='';
  if(R.kind==='skip'){R.layout='';return}
  if(R.kind==='son'){R.layout='son';parseSon(R,rows);return}
  const techs=R.kind==='avans';const maxC=Math.max(1,...rows.map(r=>r.length));
  if(!R.manual){
    const sc=Array(maxC).fill(0);rows.forEach(r=>r.forEach((v,i)=>{if(cellDate(v))sc[i]++}));const dc=sc.indexOf(Math.max(...sc));R.dateCol=dc;
    let best=-1,bs=0;rows.forEach((r,ri)=>{const k=r.filter((v,i)=>i!==dc&&typeof v==='string'&&!cellDate(v)&&matchPerson(v,true)).length;if(k>bs){bs=k;best=ri}});
    const hr0=rows.findIndex(r=>r.filter(v=>typeof v==='string'&&v.trim()&&!cellDate(v)).length>=2);
    const hrow=hr0>=0?rows[hr0].map(normName):[];const kw=re=>hrow.findIndex(v=>re.test(v));
    const lc={date:kw(/tarih|^gun|^gün|date/),who:kw(/kisi|kişi|doktor|hekim|^ad$|isim|kime|personel/),amount:kw(/tutar|miktar|^tl$|ucret|ücret|fiyat/),note:kw(/aciklama|açıklama|^not$/)};
    if(bs>=2||(bs>=1&&lc.who<0)){R.layout='grid';R.head=best}
    else if(lc.who>=0&&lc.amount>=0){R.layout='list';R.head=hr0;R.lc={...lc,date:lc.date>=0?lc.date:dc}}
    else if(sc[dc]>0&&hr0>=0){R.layout='grid';R.head=hr0}
    else{R.layout='';R.err='Bu sayfanın düzeni tanınamadı.';return}
    R.map={};R.nameMap={}}
  if(R.layout==='grid'){const hr=rows[R.head]||[];
    hr.forEach((v,i)=>{if(i===R.dateCol||v===''||v==null||typeof v!=='string')return;if(R.map[i]!==undefined)return;
      const w=matchPerson(v,techs);if(w&&(techs||w.startsWith('d:'))){R.map[i]=w;return}
      const has=rows.some((r,ri)=>ri!==R.head&&cellDate(r[R.dateCol])&&impNum(r[i]));R.map[i]=has&&!TOTALISH.test(normName(v))&&normName(v).length>=2?'new':''})}
  else if(R.layout==='list'){rows.slice(R.head+1).forEach(r=>{const w=String(r[R.lc.who]??'').trim();if(!w||!cellDate(r[R.lc.date])||w in R.nameMap)return;const m=matchPerson(w,techs);R.nameMap[w]=m&&(techs||m.startsWith('d:'))?m:'new'})}}
function parseSon(R,rows){R.blocks=[];const hs=findSonHeaders(rows);
  hs.forEach(h=>{const hr=rows[h].map(normName);let m=null;for(const v of rows[h]){m=monthFromLabel(v);if(m)break}if(!m&&h>0)for(const v of rows[h-1]){m=monthFromLabel(v);if(m)break}
    const ix=re=>hr.findIndex(v=>re.test(v));
    const col={genel:ix(/^genel$/),iade:ix(/^iade$/),tek:ix(/^teknisyen$/),avans:ix(/^avans$/),kk:ix(/^kk$/),fatura:ix(/^fatura$/),banka:ix(/^banka$/),sigorta:ix(/^sigorta$/),adet:ix(/adet|imp/)};
    const nameCol=0;const out=[];
    for(let r=h+1;r<rows.length;r++){const row=rows[r];const nm=String(row[nameCol]??'').trim();if(!nm||findSonHeaders([row]).length)break;
      const w=matchPerson(nm,false);const nums=row.filter(v=>typeof v==='number');const g=k=>col[k]>=0?impNum(row[col[k]]):0;
      out.push({name:nm,docId:w&&w.startsWith('d:')?w.slice(2):null,genel:g('genel'),iade:g('iade'),tek:g('tek'),avans:g('avans'),kk:g('kk'),fatura:g('fatura'),banka:g('banka'),sigorta:g('sigorta'),adet:g('adet'),bankaSet:col.banka>=0&&row[col.banka]!=='',sigSet:col.sigorta>=0&&row[col.sigorta]!=='',expected:nums.length?nums[nums.length-1]:null})}
    if(m&&out.length)R.blocks.push({month:m,rows:out})});
  if(!R.blocks.length)R.err='Aylık özet tablosu bulunamadı.'}
function itemsOf(R){const sh=IMP.sheets[R.si],rows=sh.rows,items=[];
  if(R.layout==='grid')rows.forEach((r,ri)=>{if(ri===R.head)return;const d=cellDate(r[R.dateCol]);if(!d)return;
    Object.keys(R.map).forEach(c=>{const w=R.map[c];if(!w)return;const a=impNum(r[c]);if(!a)return;items.push({date:d,who:w==='new'?'new:'+String(rows[R.head][c]).trim():w,amount:a})})});
  else if(R.layout==='list')rows.slice(R.head+1).forEach(r=>{const d=cellDate(r[R.lc.date]);if(!d)return;const nm=String(r[R.lc.who]??'').trim(),w=R.nameMap[nm];if(!w)return;const a=impNum(r[R.lc.amount]);if(!a)return;
    items.push({date:d,who:w==='new'?'new:'+nm:w,amount:a,note:R.lc.note>=0?String(r[R.lc.note]??''):''})});
  return items}
function allMonthsFound(){const s=new Set();IMP.R.forEach(R=>{if(R.kind==='son')(R.blocks||[]).forEach(b=>s.add(b.month));else if(R.kind!=='skip')itemsOf(R).forEach(i=>s.add(ym(i.date)))});return[...s].sort()}
function newNames(){const s={};IMP.R.forEach(R=>{if(R.kind==='skip'||R.kind==='son')return;itemsOf(R).forEach(i=>{if(i.who.startsWith('new:')){const n=i.who.slice(4);s[normName(n)]=s[normName(n)]||n}})});return s}

async function impLoadFile(f){if(!f)return;
  if(/\.xls$/i.test(f.name)){alert('Bu eski tip bir Excel dosyası (.xls). Excel\'de açıp Dosya → Farklı Kaydet → "Excel Çalışma Kitabı (*.xlsx)" olarak kaydedin, sonra o dosyayı bırakın.');return}
  let buf;try{buf=await f.arrayBuffer()}catch(e){alert('Dosya açılamadı. Büyük ihtimalle dosya şu an Excel\'de açık.\n\nExcel\'i kapatıp tekrar deneyin.');return}
  const sig=new Uint8Array(buf.slice(0,4)),isZip=sig[0]===0x50&&sig[1]===0x4B,isOle=sig[0]===0xD0&&sig[1]===0xCF,isCsv=/\.(csv|txt)$/i.test(f.name);
  if(!isCsv&&isOle){alert('Bu dosyanın içi eski tip Excel (.xls) ya da dosya şifreli.\n\nExcel\'de açıp Dosya → Farklı Kaydet → Kayıt türü: "Excel Çalışma Kitabı (*.xlsx)" seçerek yeni bir isimle kaydedin (şifre varsa önce kaldırın).');return}
  if(!isCsv&&!isZip){alert('Bu dosya Excel (.xlsx) olarak okunamadı. Excel\'de Farklı Kaydet → "Excel Çalışma Kitabı (*.xlsx)" ile kaydedip tekrar deneyin.');return}
  try{IMP.sheets=isCsv?readCsv(buf):await readXlsx(buf)}catch(e){alert('Dosya okunamadı.\n\nTeknik ayrıntı: '+e.message+'\n\nBu mesajın fotoğrafını gönderirseniz sebebini bulabiliriz.');return}
  IMP.file=f.name;IMP.result=null;IMP.newOn={};
  IMP.R=IMP.sheets.map((sh,si)=>({si,name:sh.name,kind:guessKind(sh.name,sh.rows),manual:false}));IMP.R.forEach(analyze);
  IMP.months={};allMonthsFound().forEach(m=>IMP.months[m]=true);Object.keys(newNames()).forEach(k=>IMP.newOn[k]=true);
  renderImport();toast('Dosya tarandı')}

function personOpts(cur,label,techs){return`<option value="">— Aktarma —</option>${S.doctors.map(d=>`<option value="d:${d.id}" ${cur==='d:'+d.id?'selected':''}>${esc(d.name)}${d.active===false?' (ayrıldı)':''}</option>`).join('')}
  ${techs?S.technicians.map(t=>`<option value="t:${t.id}" ${cur==='t:'+t.id?'selected':''}>${esc(t.name)} (teknisyen)</option>`).join(''):''}${label?`<option value="new" ${cur==='new'?'selected':''}>+ Yeni olarak ekle: ${esc(label)}</option>`:''}`}
function sheetSummary(R){
  if(R.kind==='skip')return'<span class="muted">Aktarılmayacak</span>';
  if(R.err)return`<span class="neg">${esc(R.err)}</span> <span class="muted">— "Düzelt"ten ayarlayabilir ya da türünü "Aktarma" yapabilirsiniz.</span>`;
  if(R.kind==='son'){const bl=(R.blocks||[]).filter(b=>IMP.months[b.month]);const un=[...new Set(bl.flatMap(b=>b.rows.filter(r=>!r.docId).map(r=>r.name)))];
    return`${bl.map(b=>monthName(b.month)).join(', ')||'Seçili ayda tablo yok'} · ${sum(bl.map(b=>b.rows.filter(r=>r.docId).length))} doktor satırı${un.length?` · <span class="neg">tanınmayan: ${esc(un.join(', '))}</span>`:''}<br><span class="muted small">Buradan teknisyen, fatura, banka, sigorta ve implant adedi alınır; hesap sonuçları Excel'le karşılaştırılır.</span>`}
  const it=itemsOf(R).filter(i=>IMP.months[ym(i.date)]);const ppl=new Set(it.map(i=>i.who));
  return`${it.length} kayıt · ${ppl.size} kişi · toplam ${fmt(sum(it.map(i=>i.amount)))} ₺ <span class="muted small">(${R.layout==='grid'?'tablo düzeni':'liste düzeni'})</span>`}
function mappingEditor(R){const sh=IMP.sheets[R.si],techs=R.kind==='avans';
  if(R.kind==='son'||R.kind==='skip')return'';
  const maxC=Math.max(1,...sh.rows.slice(0,3000).map(r=>r.length));
  const colOpt=(cur,none)=>(none?`<option value="-1" ${cur<0?'selected':''}>— yok —</option>`:'')+Array.from({length:maxC},(_,i)=>{const hv=(sh.rows[R.head]||[])[i];return`<option value="${i}" ${cur===i?'selected':''}>${colL(i)}${hv!==''&&hv!=null?' — '+esc(String(hv).slice(0,18)):''}</option>`}).join('');
  let h=`<div class="row" style="margin:8px 0"><label class="f">Düzen<select data-ir="${R.si}" data-ik="layout"><option value="grid" ${R.layout==='grid'?'selected':''}>Tablo (satır: tarih, sütun: kişi)</option><option value="list" ${R.layout==='list'?'selected':''}>Liste (her satır bir kayıt)</option></select></label>
    <label class="f">Başlık satırı<input class="num" style="width:80px" data-ir="${R.si}" data-ik="head" value="${(R.head||0)+1}"></label>`;
  if(R.layout==='grid'){h+=`<label class="f">Tarih sütunu<select data-ir="${R.si}" data-ik="dateCol">${colOpt(R.dateCol)}</select></label></div>`;
    const hr=sh.rows[R.head]||[];h+=`<table style="max-width:640px"><thead><tr><th class="l">Sütun</th><th class="l">Dosyadaki başlık</th><th class="l">Paneldeki kişi</th></tr></thead><tbody>${Object.keys(R.map).map(Number).sort((a,b)=>a-b).map(c=>`<tr><td class="l">${colL(c)}</td><td class="l"><b>${esc(hr[c])}</b></td><td class="l"><select data-ir="${R.si}" data-ik="map" data-c="${c}">${personOpts(R.map[c],String(hr[c]).trim(),techs)}</select></td></tr>`).join('')}</tbody></table>`}
  else{const lc=R.lc||{date:-1,who:-1,amount:-1,note:-1};h+=['date','who','amount','note'].map(k=>`<label class="f">${({date:'Tarih',who:'Kişi',amount:'Tutar',note:'Açıklama'})[k]} sütunu<select data-ir="${R.si}" data-ik="lc" data-c="${k}">${colOpt(lc[k],1)}</select></label>`).join('')+'</div>';
    h+=`<table style="max-width:560px"><tbody>${Object.keys(R.nameMap||{}).sort(trSort).map(n=>`<tr><td class="l"><b>${esc(n)}</b></td><td class="l"><select data-ir="${R.si}" data-ik="name" data-c="${esc(n)}">${personOpts(R.nameMap[n],n,techs)}</select></td></tr>`).join('')}</tbody></table>`}
  return h}
function renderImport(){
  let h=`<div class="card"><h2>Excel'den veri al</h2>
    <label id="dropZone" class="drop"><input type="file" id="impFile" accept=".xlsx,.xlsm,.csv,.xls" style="display:none">
      <div class="big">Excel dosyasını buraya sürükleyin</div><div class="muted">ya da tıklayıp seçin (.xlsx veya .csv)</div>${IMP.file?`<div style="margin-top:8px">Yüklü: <b>${esc(IMP.file)}</b></div>`:''}</label>
    <p class="muted small">Panel dosyadaki bütün sayfaları tarar: Genel → günlük kazançlar, kredi kartı / avans / iade sayfaları → kendi bölümleri, Son sayfası → teknisyen, fatura, banka, sigorta, implant. Aynı dosyayı tekrar yüklerseniz kayıtlar ikinci kez eklenmez, güncellenir.</p>
    ${IMP.undo?'<button class="b s d" data-act="impUndo">Son aktarımı geri al</button>':''}</div>`;
  if(IMP.sheets){const ms=allMonthsFound(),nn=newNames();
    h+=`<div class="card"><h2>Bulunanlar</h2>
      <div class="row" style="margin-bottom:10px"><span class="muted">Aylar:</span>${ms.map(m=>`<label class="c chip"><input type="checkbox" data-imonth="${m}" ${IMP.months[m]?'checked':''}> ${monthName(m)}</label>`).join('')||'<span class="muted">tarihli veri bulunamadı</span>'}</div>
      <table><thead><tr><th class="l">Excel sayfası</th><th class="l">Nereye</th><th class="l">Özet</th><th></th></tr></thead><tbody>
      ${IMP.R.map(R=>`<tr><td class="l"><b>${esc(R.name)}</b></td><td class="l"><select data-ir="${R.si}" data-ik="kind">${Object.keys(KIND).map(k=>`<option value="${k}" ${R.kind===k?'selected':''}>${KIND[k]}</option>`).join('')}</select></td><td class="l wrap">${sheetSummary(R)}</td>
        <td>${R.kind!=='skip'&&R.kind!=='son'?`<button class="b s" data-act="impEdit" data-si="${R.si}">${IMP.open===R.si?'Kapat':'Düzelt'}</button>`:''}</td></tr>
        ${IMP.open===R.si?`<tr><td colspan="4" class="l" style="background:#f8fafb">${mappingEditor(R)}</td></tr>`:''}`).join('')}</tbody></table>
      ${Object.keys(nn).length?`<h3>Panelde olmayan isimler</h3><p class="muted small">İşaretli olanlar panele yeni başlık olarak eklenir (hakediş kapalı; doktorsa Yönetim'den açıp oranını yazın). İşareti kaldırırsanız o isim aktarılmaz.</p>
        <div class="row">${Object.keys(nn).map(k=>`<label class="c chip"><input type="checkbox" data-inew="${k}" ${IMP.newOn[k]!==false?'checked':''}> ${esc(nn[k])}</label>`).join('')}</div>`:''}
      <div class="row" style="margin-top:14px"><button class="b p big" data-act="impApply" ${IMP.busy?'disabled':''}>${IMP.busy?'Aktarılıyor…':'Seçili ayları içeri al'}</button>
      <span class="muted small">Aktarmadan önce etkilenen ayların kopyası alınır; beğenmezseniz "Son aktarımı geri al".</span></div></div>`}
  if(IMP.result)h+=IMP.result;
  main.innerHTML=h}
CHANGE.push(t=>{
  if(U.tab!=='imp')return;
  if(t.id==='impFile'){impLoadFile(t.files[0]);t.value='';return}
  if(t.dataset.imonth){IMP.months[t.dataset.imonth]=t.checked;return renderImport()}
  if(t.dataset.inew){IMP.newOn[t.dataset.inew]=t.checked;return}
  if(t.dataset.ir===undefined)return;const R=IMP.R[+t.dataset.ir],k=t.dataset.ik;
  if(k==='kind'){R.kind=t.value;R.manual=false;analyze(R);Object.keys(newNames()).forEach(x=>{if(IMP.newOn[x]===undefined)IMP.newOn[x]=true});allMonthsFound().forEach(m=>{if(IMP.months[m]===undefined)IMP.months[m]=true})}
  else{R.manual=true;
    if(k==='layout'){R.layout=t.value;R.map={};R.nameMap={};if(R.layout==='list'&&!R.lc)R.lc={date:R.dateCol||0,who:-1,amount:-1,note:-1}}
    else if(k==='head'){R.head=Math.max(0,(parseInt(t.value)||1)-1);R.map={};R.nameMap={}}
    else if(k==='dateCol'){R.dateCol=+t.value;R.map={}}
    else if(k==='lc'){R.lc[t.dataset.c]=+t.value;R.nameMap={}}
    else if(k==='map'){R.map[t.dataset.c]=t.value;return renderImport()}
    else if(k==='name'){R.nameMap[t.dataset.c]=t.value;return renderImport()}
    analyze(R)}
  renderImport()});
ACT.impEdit=a=>{const si=+a.dataset.si;IMP.open=IMP.open===si?null:si;renderImport()};

async function impApply(){
  const sel=Object.keys(IMP.months).filter(m=>IMP.months[m]);if(!sel.length){toast('En az bir ay seçin');return}
  // 1) yeni isimler
  const nn=newNames(),created={},newDocs={};let ord=maxOrder(S.doctors);
  Object.keys(nn).forEach(k=>{if(IMP.newOn[k]===false)return;const ex=S.doctors.find(d=>normName(d.name)===k);if(ex){created[k]=ex.id;return}const id=uid();created[k]=id;newDocs[id]={name:nn[k],pay:false,rate:0,kkOn:false,kkRate:'',fatura:false,implant:false,implantUnit:0,banka:0,sigorta:0,active:true,order:ord++}});
  const res=w=>{if(w.startsWith('new:')){const id=created[normName(w.slice(4))];return id?{docId:id}:null}return w.startsWith('t:')?{techId:w.slice(2)}:{docId:w.slice(2)}};
  // 2) yamalar
  const P={},Pm=m=>P[m]=P[m]||{};const got={};const mark=(m,k)=>{(got[m]=got[m]||{})[k]=true};
  IMP.R.forEach(R=>{if(R.kind==='skip'||R.kind==='son'||R.err)return;const occ={};
    itemsOf(R).forEach(it=>{const m=ym(it.date);if(!IMP.months[m])return;const r=res(it.who);if(!r)return;
      if(R.kind==='earn'){if(!r.docId)return;const p=Pm(m);p.days=p.days||{};const d=p.days[it.date]=p.days[it.date]||{e:{}};d.e[r.docId]=(d.e[r.docId]||0)+it.amount;mark(m,'earn')}
      else{const key=[R.kind,it.date,r.docId||r.techId,it.amount].join('|');occ[key]=(occ[key]||0)+1;const id='x'+hash(key+'|'+occ[key]);
        const p=Pm(m);p[R.kind]=p[R.kind]||{};p[R.kind][id]={date:it.date,docId:r.docId||null,techId:r.techId||null,title:'',amount:it.amount,note:it.note||'Excel\'den aktarıldı',by:S.uid,bn:S.name||S.email,at:Date.now()};mark(m,R.kind)}})});
  const sons=IMP.R.filter(R=>R.kind==='son'&&!R.err).flatMap(R=>R.blocks||[]).filter(b=>IMP.months[b.month]);
  const before={};const touched=new Set([...Object.keys(P),...sons.map(b=>b.month)]);
  for(const m of touched)before[m]=await store.getMonth(m);
  sons.forEach(b=>{const m=b.month,ld=lastDay(m),p=Pm(m),cur=before[m]||{};const has=k=>(got[m]||{})[k]||(k==='earn'?Object.values(cur.days||{}).some(dayHas):Object.keys(cur[k]||{}).length>0);
    b.rows.forEach(r=>{if(!r.docId)return;const d=docById(r.docId)||{};p.monthly=p.monthly||{};const mo=p.monthly[r.docId]={};
      if(r.bankaSet)mo.banka=r.banka;if(r.sigSet)mo.sigorta=r.sigorta;if(r.fatura)mo.fatura=r.fatura;if(r.adet)mo.implant=r.adet;
      p.lab=p.lab||{};const lid='son_lab_'+r.docId;if(r.tek)p.lab[lid]={date:ld,docId:r.docId,techId:null,title:'',amount:r.tek,note:'Excel Son sayfası teknisyen toplamı',by:S.uid,bn:S.name||S.email,at:Date.now()};else if((cur.lab||{})[lid])p.lab[lid]=DEL;
      ['kk','avans','iade'].forEach(k=>{if(has(k)&&!(cur[k]||{})['son_'+k+'_'+r.docId])return;const id='son_'+k+'_'+r.docId;p[k]=p[k]||{};p[k][id]=r[k]?{date:ld,docId:r.docId,techId:null,title:'',amount:r[k],note:'Excel Son sayfası ay toplamı',by:S.uid,bn:S.name||S.email,at:Date.now()}:DEL});
      if(!has('earn')&&r.genel){p.days=p.days||{};const dd=p.days[ld]=p.days[ld]||{e:{}};dd.e=dd.e||{};dd.e[r.docId]=r.genel}})});
  const ms=Object.keys(P);if(!ms.length&&!Object.keys(newDocs).length){toast('Aktarılacak veri bulunamadı');return}
  const nItems=sum(ms.map(m=>{const p=P[m];return sum(Object.values(p.days||{}).map(d=>Object.keys(d.e||{}).length))+['kk','avans','iade','lab'].reduce((a,k)=>a+Object.keys(p[k]||{}).length,0)}));
  if(!confirm(`${ms.map(monthName).join(', ')} için ${nItems} kayıt panele aktarılacak${Object.keys(newDocs).length?` ve ${Object.keys(newDocs).length} yeni isim eklenecek`:''}. Devam edilsin mi?`))return;
  IMP.busy=true;renderImport();
  try{if(Object.keys(newDocs).length)await store.patchSettings({doctors:newDocs});
    for(const m of ms)await store.patchMonth(m,P[m]);
    IMP.undo={before,newDocs:Object.keys(newDocs)};
    // 3) doğrulama
    let html=`<div class="card"><h2>Aktarım tamamlandı</h2><p>${ms.map(monthName).join(', ')} — ${nItems} kayıt aktarıldı.</p>`;
    if(sons.length){for(const b of sons){S.months[b.month]=await store.getMonth(b.month)||{};}
      html+=sons.map(b=>{const rows=b.rows.filter(r=>r.docId&&r.expected!=null).map(r=>{const d=docById(r.docId);if(!d||d.pay===false)return null;const net=calcDoc(b.month,d).net;const ok=Math.abs(net-r.expected)<1;return[d.name,r.expected,net,ok]}).filter(Boolean);
        const bad=rows.filter(r=>!r[3]).length;
        return`<h3>${monthName(b.month)}: Excel sonucu ile panel karşılaştırması ${bad?`<span class="neg">(${bad} doktorda fark var)</span>`:'<span class="ok-t">(hepsi tutuyor ✓)</span>'}</h3>
        <table style="max-width:620px"><thead><tr><th class="l">Doktor</th><th>Excel (Son)</th><th>Panel</th><th>Durum</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="l">${esc(r[0])}</td><td>${fmt(r[1])}</td><td>${fmt(r[2])}</td><td>${r[3]?'<span class="ok-t">✓</span>':fmtc(r[2]-r[1])}</td></tr>`).join('')}</tbody></table>`}).join('')+
        `<p class="muted small">Fark varsa çoğunlukla sebebi doktorun oranı, KK/fatura ayarı ya da kredi kartı/avans/iade sayfasının farklı okunmasıdır. Aylık Hesap sekmesinden kontrol edebilirsiniz.</p>`}
    IMP.result=html+'</div>';IMP.sheets=null;IMP.file='';toast('Aktarım tamamlandı',1)}
  catch(e){alert('Aktarım yarıda kaldı: '+errMsg(e)+'\n\n"Son aktarımı geri al" ile başa dönebilirsiniz.');IMP.undo={before,newDocs:Object.keys(newDocs)}}
  finally{IMP.busy=false;renderImport()}}
ACT.impApply=()=>impApply();
ACT.impUndo=async()=>{const u=IMP.undo;if(!u||!confirm('Son aktarım geri alınsın mı? Etkilenen aylar aktarımdan önceki haline döner (o aylara aktarımdan sonra girilen kayıtlar da geri gider).'))return;
  try{for(const[m,d]of Object.entries(u.before)){if(d)await store.setMonth(m,d);else await store.deleteMonth(m)}
    if(u.newDocs.length){const p={};u.newDocs.forEach(id=>p[id]=DEL);await store.patchSettings({doctors:p})}
    IMP.undo=null;IMP.result=null;renderImport();toast('Son aktarım geri alındı',1)}catch(e){alert(errMsg(e))}};

    $('clGo').onclick=async()=>{const name=$('clName').value.trim();if(!name){$('clMsg').textContent='Adınızı yazın.';return}$('clGo').disabled=true;
      try{await store.claimOwner(name);await store.patchSettings({...DEF_SETTINGS,clinicName:$('clClinic').value.trim(),token:uid()+uid()});location.reload()}
      catch(e){$('clMsg').textContent=errMsg(e);$('clGo').disabled=false}};return}
  let prof=null;try{prof=await store.getProfile(u.uid)}catch(e){}
  S.owner=owner.uid===u.uid;S.ownerUid=owner.uid;
  if(!S.owner&&(!prof||prof.active===false)){gate(`<h2>Giriş yetkiniz yok</h2><p>${esc(u.email)} hesabı bu panele ${prof?'kapatılmış':'eklenmemiş'}. Panel yöneticisine başvurun.</p><button class="b" id="gOut">Çıkış yap</button>`);$('gOut').onclick=async()=>{await store.logout();location.reload()};return}
  S.role=S.owner?'admin':(prof.role==='admin'?'admin':'staff');S.name=(prof&&prof.name)||u.email;
  show('app');buildNav();main.innerHTML='<div class="card muted">Yükleniyor…</div>';
  store.onSettings(st=>{applySettings(st);const first=!S.settingsLoaded;S.settingsLoaded=true;if(first){render();if(isAdmin())setTimeout(autoTasks,4000)}else{settingsDirty=true;schedule()}});
  if(isAdmin())store.onUsers(a=>{S.users=a;if(U.tab==='yonetim')schedule()});
  setInterval(()=>{if(isAdmin())autoTasks()},30*60*1000)}
async function boot(){
  if(FIREBASE_CONFIG){try{store=await makeFirebaseStore(FIREBASE_CONFIG)}catch(e){gate(`<h2>Panel yüklenemedi</h2><p>İnternet bağlantınızı kontrol edip sayfayı yenileyin.</p><p class="muted small">${esc(e.message)}</p>`);return}}
  else{store=makeMemoryStore();$('demo').hidden=false}
  store.onAuth(u=>{onUser(u)})}
boot();

</script>
</body>
